allowBuilds:
  node-pty: true
  esbuild: true
  better-sqlite3: true
  tesseract.js: false

overrides:
  nf3: "0.3.17"
  "@assistant-ui/tap": "^0.5.14"
  "@assistant-ui/store": ">=0.2.9 <0.2.14"
  vite: "catalog:"

minimumReleaseAgeExclude:
  - typescript-7
  - typescript
  - fast-xml-parser
  - "@sentry/*"
  - "@typescript/*"
  - "@modelcontextprotocol/server"
  - "@modelcontextprotocol/node"
  - "@modelcontextprotocol/core"
  - "@modelcontextprotocol/client"
  - "@agent-native/core@0.133.1"

patchedDependencies:
  "@agent-native/core@0.133.1": patches/@agent-native__core@0.133.1.patch
catalog:
  # Real Vite 8.1.0 for dev/build/start: the framework's `agent-native dev`
  # spawns the `vite` bin, and Nitro's dev worker resolves
  # `virtual:react-router/server-build` through real Vite. The vite-plus fork
  # breaks that SSR path ("No fetch handler exported from
  # virtual:react-router/server-build"). vite-plus stays as the test runner.
  vite: 8.1.0
  vite-plus: 0.2.7
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
